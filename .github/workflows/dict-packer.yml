name: Release Packed Dict

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 5' # 每周五晚上5点执行，根据Github抵消时差后是17-8

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      latest: ${{ steps.versions.outputs.latest }}
    steps:
      - name: Checkout Language Pack
        uses: actions/checkout@v4
        with:
          fetch-depth: '1'
          repository: CFPAOrg/Minecraft-Mod-Language-Package
          path: Minecraft-Mod-Language-Package

      - name: Resolve packer versions
        id: versions
        run: |
          python <<'PY' > $GITHUB_OUTPUT
          import json
          import re
          from pathlib import Path

          legacy_path = Path('Minecraft-Mod-Language-Package') / 'config' / 'packer.json'
          config_dir = Path('Minecraft-Mod-Language-Package') / 'config' / 'packer'

          versions = []
          if legacy_path.exists():
              config = json.loads(legacy_path.read_text(encoding='utf-8'))
              versions = [entry['targetVersion'] for entry in config if 'targetVersion' in entry]

          if not versions and config_dir.is_dir():
              versions = []
              for path in sorted(config_dir.glob('*.json'), key=lambda item: item.name):
                  if path.stem == 'packer-example':
                      continue
                  versions.append(path.stem)

          if not versions:
              version_pattern = re.compile(r"^\\d+\\.\\d+(?:\\.\\d+)?(?:-[\\w-]+)?$")
              project_dir = Path('Minecraft-Mod-Language-Package') / 'projects'
              versions = sorted(
                  [entry.name for entry in project_dir.iterdir() if entry.is_dir() and version_pattern.fullmatch(entry.name)],
                  key=lambda item: item
              )

          if not versions:
              versions = [
                  "1.12.2",
                  "1.16",
                  "1.16-fabric",
                  "1.18",
                  "1.18-fabric",
                  "1.19",
                  "1.20",
                  "1.20-fabric",
                  "1.21",
                  "1.21-fabric",
                  "26.1",
                  "26.1-fabric",
              ]
          if not versions:
              raise SystemExit('No packer targets found in upstream config')

          versions = list(dict.fromkeys(versions))
          print(f"versions={json.dumps(versions)}")
          print(f"latest={versions[-1]}")
          PY

  packer:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
    steps:
      - name: Checkout Scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: '1'

      - name: Checkout Language Pack
        uses: actions/checkout@v4
        with:
          fetch-depth: '1'
          repository: CFPAOrg/Minecraft-Mod-Language-Package
          path: Minecraft-Mod-Language-Package

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pack dict
        run: python ./src/packer.py ${{ matrix.version }}

      - name: Upload JSON files
        uses: actions/upload-artifact@v4
        with:
          name: Dict-${{ matrix.version }}.json
          path: DictPacker/Dict-${{ matrix.version }}.json
          compression-level: 9

  release:
    needs: [prepare, packer]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Scripts
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download JSON files
        uses: actions/download-artifact@v4
        with:
          path: DictPacker
          merge-multiple: true

      - name: Pack Integral files
        run: python ./src/integral.py

      - name: Create timestamp
        id: create_timestamp
        run: echo "timestamp=$(date -u '+%Y_%m_%d_%H_%M_%S')" >> $GITHUB_OUTPUT

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: 模组词典-${{ steps.create_timestamp.outputs.timestamp }}
          tag_name: 模组词典-${{ steps.create_timestamp.outputs.timestamp }}
          files: |
            Dict.json
            Dict-Mini.json
            Dict-Sqlite.db
          # https://github.com/CFPATools/i18n-dict/actions/runs/${{ github.run_id }}
          body: |
            当前词典的最新版本：${{ needs.prepare.outputs.latest }}
            
            你可以在以下 Actions 链接下载各个独立 Minecraft 版本的模组词典：
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  cleanup:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: pip install PyGithub python-dateutil types-python-dateutil

      - name: Run Cleanup Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/cleanup.py
