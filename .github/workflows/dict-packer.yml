name: Release Packed Dict

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 5' # 每周五北京时间 17:00（UTC 09:00）

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.upstream.outputs.sha }}
      versions: ${{ steps.versions.outputs.versions }}
      latest: ${{ steps.versions.outputs.latest }}
    steps:
      - name: Checkout Scripts
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Checkout Language Pack
        uses: actions/checkout@v4
        with:
          fetch-depth: '1'
          repository: CFPAOrg/Minecraft-Mod-Language-Package
          path: Minecraft-Mod-Language-Package

      - name: Pin upstream revision
        id: upstream
        run: echo "sha=$(git -C Minecraft-Mod-Language-Package rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve packer versions
        id: versions
        run: python -m src.upstream >> "$GITHUB_OUTPUT"

  packer:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.prepare.outputs.versions) }}
    steps:
      - name: Checkout Scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: '1'

      - name: Checkout Language Pack
        uses: actions/checkout@v4
        with:
          fetch-depth: '1'
          repository: CFPAOrg/Minecraft-Mod-Language-Package
          ref: ${{ needs.prepare.outputs.upstream_sha }}
          path: Minecraft-Mod-Language-Package

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Pack dict
        env:
          PACKER_VERSION: ${{ matrix.version }}
        run: python -m src.packer "$PACKER_VERSION"

      - name: Upload JSON files
        uses: actions/upload-artifact@v4
        with:
          name: Dict-${{ matrix.version }}.json
          path: DictPacker/Dict-${{ matrix.version }}.json
          compression-level: 9

  release:
    needs: [prepare, packer]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Scripts
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download JSON files
        uses: actions/download-artifact@v4
        with:
          path: DictPacker
          merge-multiple: true

      - name: Pack Integral files
        run: python -m src.integral

      - name: Create timestamp
        id: create_timestamp
        run: echo "timestamp=$(date -u '+%Y_%m_%d_%H_%M_%S')" >> $GITHUB_OUTPUT

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: 模组词典-${{ steps.create_timestamp.outputs.timestamp }}
          tag_name: 模组词典-${{ steps.create_timestamp.outputs.timestamp }}
          files: |
            Dict.json
            Dict-Mini.json
            Dict-Sqlite.db
          body: |
            当前词典的最新版本：${{ needs.prepare.outputs.latest }}
            上游修订：${{ needs.prepare.outputs.upstream_sha }}
            
            你可以在以下 Actions 链接下载各个独立 Minecraft 版本的模组词典：
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # A published release alone does not count as repository activity for cron.
      # Record provenance in Git so weekly publishing survives the 60-day cutoff.
      - name: Record release provenance and keep schedule active
        env:
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          PACKER_VERSIONS: ${{ needs.prepare.outputs.versions }}
          RELEASE_TAG: 模组词典-${{ steps.create_timestamp.outputs.timestamp }}
        run: |
          python <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          state = {
              "published_at": datetime.now(timezone.utc).isoformat(),
              "tag": os.environ["RELEASE_TAG"],
              "upstream_sha": os.environ["UPSTREAM_SHA"],
              "versions": json.loads(os.environ["PACKER_VERSIONS"]),
          }
          Path('.github/release-state.json').write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')
          PY
          git add .github/release-state.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Record dictionary release $RELEASE_TAG"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

  cleanup:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Cleanup Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/cleanup.py
